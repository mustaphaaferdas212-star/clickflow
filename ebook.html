<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Your Free Ebook</title>

    <style>
        * {

            min-height: 100vh;
            display: flex;
            justify-content: center;

            padding: 20px;
        }

        .card {

            max-width: 500px;

            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        h1 {
            color: #111827;
            margin-bottom: 12px;
        }

        p {
            color: #555555;
            line-height: 1.6;
        }

        .download {
            display: block;
            background: #16a34a;
            color: white;
            text-decoration: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 25px;
        }

        .download:hover {
            background: #15803d;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Your Free Ebook</h1>
